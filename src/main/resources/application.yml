server:
  port: 8084

spring:
  application:
    name: kb-mcp
  ai:
    mcp:
      server:
        enabled: true
        protocol: STREAMABLE
        type: SYNC
        name: ${SPRING_AI_MCP_SERVER_NAME:kb-ielts-mcp}
        version: ${SPRING_AI_MCP_SERVER_VERSION:1.0.0}
        stdio: false
        capabilities:
          completion: true
        streamable-http:
          mcp-endpoint: /mcp
          disallow-delete: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

ielts:
  app:
    base-url: ${IELTS_APP_BASE_URL:http://localhost:8083}

mcp:
  rate-limit:
    rpm: ${MCP_RATE_LIMIT_RPM:60}
