version: '3.9'

services:
  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: kb-mcp
    ports:
      - "8084:8084"
    env_file:
      - .env
    environment:
      IELTS_APP_BASE_URL: http://kb-ielts:8083
      MCP_RATE_LIMIT_RPM: ${MCP_RATE_LIMIT_RPM:-60}
    networks:
      - ielts-network
    restart: unless-stopped

networks:
  ielts-network:
    external: true
    name: ielts-network
