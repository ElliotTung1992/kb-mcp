server:
  port: 8084

spring:
  application:
    name: kb-mcp
  ai:
    mcp:
      server:
        enabled: true
        name: ${SPRING_AI_MCP_SERVER_NAME:enterprise-kb}
        version: ${SPRING_AI_MCP_SERVER_VERSION:1.0.0}
        stdio: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

kb:
  app:
    base-url: ${KB_APP_BASE_URL:http://localhost:8081}

ielts:
  app:
    base-url: ${IELTS_APP_BASE_URL:http://localhost:8083}

mcp:
  rate-limit:
    rpm: ${MCP_RATE_LIMIT_RPM:60}
  # token 文件存储路径
  token-file: ${KB_MCP_TOKEN_FILE:/data/.kb-mcp-token}
